{{- /* OG image — generated at build time from live site data */ -}}
{{- $posts := where .Site.RegularPages "Section" "posts" | first 9 -}}
{{- $menuItems := slice -}}
{{- range .Site.Menus.main -}}
  {{- if strings.HasPrefix .URL "/" -}}
    {{- $menuItems = $menuItems | append . -}}
  {{- end -}}
{{- end -}}
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="#000000"/>

  <!-- menu bar -->
  <rect width="1200" height="40" fill="#0a0f0a"/>
  <rect y="40" width="1200" height="1" fill="#111c17"/>
  <text x="16" y="27" fill="#b4aeae" font-size="17" font-family="monospace">&#x2261;</text>
  <rect x="44" y="9" width="1" height="22" fill="#248f6c" opacity="0.5"/>
  <text x="56" y="27" fill="#5fd7af" font-size="14" font-weight="bold" font-family="monospace">{{ .Site.Title | htmlEscape }}</text>
  {{- range $i, $item := $menuItems }}
  <text x="{{ add 180 (mul $i 82) }}" y="27" fill="#b4aeae" font-size="12" font-family="monospace">{{ $item.Name | plainify | strings.TrimSpace | htmlEscape }}</text>
  {{- end }}
  <text x="1082" y="27" fill="#888888" font-size="12" font-family="monospace">T  W  &#x25D1;  &#x25D0;</text>

  <!-- page title -->
  <text x="80" y="104" fill="#ab82ff" font-size="28" font-weight="bold" font-family="monospace">&#x2A6E;  {{ .Site.Title | htmlEscape }}  &#x2A6E;</text>
  <line x1="80" y1="120" x2="1120" y2="120" stroke="#111c17" stroke-width="1"/>

  <!-- post list -->
  {{- range $i, $p := $posts }}
  {{- $y := add 156 (mul $i 26) -}}
  {{- if eq $i 0 }}
  <rect x="80"  y="{{ sub $y 19 }}" width="4"    height="26" fill="#5fd7af" rx="1"/>
  <rect x="84"  y="{{ sub $y 19 }}" width="1116" height="26" fill="#111c17"/>
  <text x="98"  y="{{ $y }}" fill="#6ae4b9" font-size="13" font-family="monospace">&#x25B6;</text>
  <text x="122" y="{{ $y }}" fill="#ab82ff" font-size="14" font-family="monospace">{{ $p.Title | truncate 56 "…" | htmlEscape }}</text>
  <text x="1068" y="{{ $y }}" fill="#2fafff" font-size="12" font-family="monospace">{{ $p.Date.Format "2006-01-02" }}</text>
  {{- else }}
  <text x="122" y="{{ $y }}" fill="#ffffff" font-size="14" font-family="monospace">{{ $p.Title | truncate 56 "…" | htmlEscape }}</text>
  <text x="1068" y="{{ $y }}" fill="#4a6890" font-size="12" font-family="monospace">{{ $p.Date.Format "2006-01-02" }}</text>
  {{- end }}
  {{- end }}

  <!-- fade -->
  <rect x="0" y="330" width="1200" height="268" fill="url(#fade)"/>

  <!-- modeline -->
  <rect y="598" width="1200" height="32" fill="#0a0f0a"/>
  <rect y="598" width="1200" height="1" fill="#248f6c"/>
  <text x="16"  y="619" fill="#888888" font-size="11" font-family="monospace">{{ now.Format "2006-01-02" }}</text>
  <text x="116" y="619" fill="#3a3a3a" font-size="11" font-family="monospace">&#xB7;</text>
  <text x="126" y="619" fill="#5fd7af" font-size="11" font-weight="bold" font-family="monospace"> *{{ .Site.Title | htmlEscape }}*</text>
  <text x="260" y="619" fill="#3a3a3a" font-size="11" font-family="monospace">&#xB7;</text>
  <text x="270" y="619" fill="#888888" font-size="11" font-family="monospace">Nw  &#xB7;  All</text>
  <text x="1106" y="619" fill="#888888" font-size="11" font-family="monospace">? help</text>
</svg>
