# baseURL = "https://idlip.github.io"
languageCode = "en"
title = "Dilip's Log"
theme = "emacs"

copyright = "Copyright © 2023-2026, Dilip | Zororg; All rights reserved."

enableEmoji = true
enableInlineShortcodes = true
staticDir = ["static"]

# Ignore non-data files in the tinted-theming schemes submodule
ignoreFiles = ["data/schemes/LICENSE", "data/schemes/.+\\.md$", "data/schemes/scripts"]

[mediaTypes]
[mediaTypes."application/javascript"]
suffixes = ["js"]

[outputFormats]
[outputFormats.WanderJS]
mediaType = "application/javascript"
baseName = "wander"
isPlainText = true
notAlternative = true

[outputFormats.RSS]
mediatype = "application/rss+xml"
baseName = "rss"

[outputFormats.Feed]
mediatype = "application/rss+xml"
baseName = "feed"

[outputFormats.Index]
mediatype = "application/rss+xml"
baseName = "index"

[outputs]
home     = ["HTML", "RSS", "Feed", "Index"]
section  = ["HTML", "RSS", "Feed", "Index"]
term     = ["HTML", "RSS", "Feed", "Index"]
taxonomy = ["HTML"]
page     = ["HTML"]

[pagination]
  pagerSize = 7

[markup.goldmark.renderer]
  unsafe = true

[markup.highlight]
  noClasses = false

[taxonomies]
  tag = "tags"

publishDir = "public"

[params]
description = "Dilip's Log"

