[[menu.main]]
  name = "About"
  weight = 4
  url = "/about/"

[[menu.main]]
  name = " "
  weight = 5
  url = "index.xml"


[languages]
  [languages.en]
    languageName = "English"
    languageCode = "en-us"
    weight = 1
