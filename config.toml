# baseURL = "https://idlip.github.io"
languageCode = "en"
title = "Dilip's Log"
theme = "emacs"

copyright = "Copyright © 2023-2026, Dilip | Zororg; All rights reserved."

enableEmoji = true
enableInlineShortcodes = true

[outputFormats]
[outputFormats.RSS]
mediatype = "application/rss+xml"
baseName = "rss"

[outputFormats.Feed]
mediatype = "application/rss+xml"
baseName = "feed"

[outputs]
home     = ["HTML", "RSS", "Feed"]
section  = ["HTML", "RSS", "Feed"]
term     = ["HTML", "RSS", "Feed"]
taxonomy = ["HTML"]
page     = ["HTML"]

[pagination]
  pagerSize = 7

[markup.goldmark.renderer]
  unsafe = true

[markup.highlight]
  noClasses = false

[taxonomies]
  tag = "tags"

publishDir = "public"

[params]
description = "Dilip's Log"
favicon = "/images/op-roger.jpg"

# Post listing row icons — checked in priority order, first matching tag wins.
[[params.tagIcons]]
  tags  = ["snippets"]
  icon = ""
[[params.tagIcons]]
